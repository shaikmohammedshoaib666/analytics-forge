    group: optimization_i40
    library: gurobipy
    task: optimization
    estimator: gurobipy
    optional: true
    requires_license: true
    note: Needs commercial Gurobi license — use stronger host / local license.
  - id: ORTools
    group: optimization_i40
    library: ortools
    task: optimization
    estimator: ortools
    optional: true
    note: Install ortools on a stronger host for layout/scheduling optimization.
  - id: PyTorchStub
    group: deep_learning_enterprise
    library: torch
    task: deep_learning
    estimator: stub
    optional: true
    note: Use AWS/GCP/Azure GPU hosts — too heavy for Streamlit Cloud free tier.
  - id: PySparkStub
    group: big_data_enterprise
    library: pyspark
    task: big_data
    estimator: stub
    optional: true
    note: Needs Spark cluster (Databricks/EMR) — not for Streamlit Community Cloud.

